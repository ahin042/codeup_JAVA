name: Update CodeUp Stats

on:
  schedule:
    # 매일 09:00 KST (UTC+9) = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update CodeUp stats
        run: python update_codeup_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- README.md codeup-stats.svg; then
            git add README.md codeup-stats.svg
            git commit -m "chore: update CodeUp stats"
            git push
          else
            echo "No changes to commit."
          fi
